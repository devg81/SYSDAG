  # ==== M8 (pilot 50) -- height/weight: still NOT SUPPORTED =============
  # Deliberately NOT a distribution. Kept here so the gap and the exact
  # missing quantity are recorded where every other parameter's evidence
  # lives, rather than only in a report.
  anthropometrics_height_weight:
    status: "NOT SUPPORTED -- deferred, no values generated"
    what_is_missing: >-
      A national mean AND standard deviation of adult height in cm, by
      sex, for Indian adults. The mean alone is insufficient: without a
      dispersion figure, any generated height distribution would have an
      invented shape -- the identical objection this project already
      used (and accepted) to REJECT a peaked within-category BMI
      distribution (see risk_factors.bmi.limitations, M2D-2).
    searched_and_not_found: >-
      M4-0 recorded 3 failed access attempts. M8 added 3 more research
      passes. (1) NFHS-5-based adult-height literature: PLOS ONE
      doi:10.1371/journal.pone.0255676 reports only round-to-round
      CHANGES in mean height (e.g. men 26-50 declined 0.86 cm between
      NFHS-III and NFHS-IV), not an absolute mean with SD. (2) Deaton's
      distribution-of-adult-heights analysis (PMC2630164) reports
      STATE-level means at age 20 from NFHS-3 (men 157.2-168.6 cm,
      women 149.1-154.9 cm) and explicitly reports no all-India mean
      and no all-India SD -- it uses a regression standard error as its
      dispersion measure instead. (3) An ICMR-focused pass surfaced only
      the ICMR-NIN 2020 "Reference Indian Adult Man/Woman" (65 kg /
      1.77 m; 55 kg / 1.62 m) -- an IDEALISED reference individual, not
      a population distribution, and whose 1.77 m is plainly
      inconsistent with the ~165 cm national male mean, so it must not
      be used as one. Secondary summaries put the NFHS-5 means near
      165 cm (men) and 152 cm (women), consistent with Deaton's state
      ranges, but no primary table carrying BOTH the mean and the SD
      was verified in this pass.
    why_not_generated: >-
      BMI is already this project's evidence-primary anthropometric
      variable (docs/M4_CLINICAL_ARCHITECTURE.md section 1, M4-0's
      resolved recommendation). Generating height from an invented
      dispersion and back-solving weight = bmi * (height/100)^2 would
      leave BMI exactly correct while making height and weight
      model-generated values dressed as measurements. Deferred instead.
    concrete_recommendation: >-
      Two routes, in preference order. (1) Obtain a primary mean+SD: the
      DHS/NFHS-5 recode files, or the NFHS-5 India Report (FR375)
      anthropometry tables, are the direct source; one verified
      mean+SD-by-sex table unblocks this immediately. (2) If only
      Deaton's verified STATE-level means are obtainable, a national
      mean can be assembled from them using this config's OWN
      Census-2011 state distribution (demographics.state) as weights --
      fully traceable, no new assumption beyond the weighting -- but
      that still yields no SD, so route (1) remains necessary. Once a
      mean+SD exists: sample height ~ N(mean_sex, sd_sex), derive
      weight = bmi * (height/100)^2, leave BMI untouched, and validate
      the BMI arithmetic to within rounding. Implementation hook is
      already present and tested as a no-op:
      generation.indian_population.sample_height_cm().
    evidence_tier: "E (unavailable)"

# M4E, docs/DECISIONS.md D016. Treatment-rate evidence per diagnosed
# condition, not per pharmacological subclass -- no drug-class-share or
# drug-name distribution exists anywhere researched (docs/
# M4E_MEDICATION_EVIDENCE.md). Statin/antiplatelet treatment rates:
# NOT SUPPORTED at population level -- not represented here at all.
medications:
  antihypertensive_treatment_rate:
    source: "ICMR-NNMS 2017-18 hypertension care cascade, PMC10156594"
    year: "2017-18 fieldwork"
    population: >-
      National, 300 rural/300 urban clusters, n=3,017 hypertensive of
      10,593 measured, ages 18-69 (same NNMS survey already used for
      risk_factors.hypertension/bmi/smoking_status)
    geographic_scope: "National"
    definition: >-
      Fraction of diagnosed hypertensive adults currently on
      antihypertensive treatment (point-prevalence at survey time),
      among all hypertensives (aware + unaware) -- 14.5% (95% CI
      12.7-16.5).
    available_stratification: >-
      National marginal (14.5%) used here. A sex-stratified split
      exists in the same source (male 10.9%, female 18.8%) but is
      deliberately NOT used -- risk_factors.hypertension itself is
      generated as a sex-unconditioned national marginal (M2D, confirmed
      correct), so conditioning only the downstream treatment rate on
      sex while the diagnosis it depends on remains sex-unconditioned
      would introduce an inconsistent asymmetry not present anywhere
      else in this project. Documented in docs/M4E_MEDICATION_EVIDENCE.md,
      not adopted.
    marginal_or_conditional: "marginal, conditioned only on diagnoses containing code=hypertension"
    transformation: "none -- direct Bernoulli(p)"
    limitations: >-
      Cross-sectional point-prevalence of "currently treated" -- does
      not itself imply duration, adherence, or which specific drug
      class. Ages 18-69 sampled (narrower than this project's 20-89
      scope) -- the same extrapolation gap already accepted for
      BMI/smoking (D008).
    evidence_tier: "A (observed)"
    distribution:
      type: bernoulli
      p: 0.145
  antidiabetic_treatment_rate:
    source: "ICMR-NNMS 2017-18 diabetes care cascade, PMC8964146"
    year: "2017-18 fieldwork"
    population: >-
      National, same survey design, n=904 diabetic of 9,721 surveyed,
      ages 18-69
    geographic_scope: "National"
    definition: >-
      Fraction of diagnosed diabetic adults currently on antidiabetic
      treatment (point-prevalence at survey time), among all diabetics
      (aware + unaware) -- 36.1%.
    available_stratification: >-
      National marginal (36.1%) used here. A sex split of the
      treatment-given-aware sub-rate exists (male 82.6%, female 74.5%)
      but is a different, conditional quantity (requires an "aware"
      variable this project does not generate) -- not used, same
      reasoning as the hypertension entry above.
    marginal_or_conditional: "marginal, conditioned only on diagnoses containing code=diabetes"
    transformation: "none -- direct Bernoulli(p)"
    limitations: >-
      Same point-prevalence caveat as antihypertensive_treatment_rate.
      Ages 18-69 sampled.
    evidence_tier: "A (observed)"
    distribution:
      type: bernoulli
      p: 0.361

# D021 (2026-11-10): ambient air quality. A deterministic LOOKUP by
# demographics.state -- an observed fact about a place and year, never
# sampled. Plan: docs/Further_Steps_for_patient-Record_complete.txt §3.
environment:
  air_quality:
    source: >-
      CPCB Continuous Ambient Air Quality Monitoring Stations (CAAQMS),
      hourly station-level AQI from the CPCB AQI Repository, as
      republished by github.com/Vonter/india-cpcb-aqi (ODbL-1.0,
      attribution required; some contents (c) CPCB), file
      data/cpcb-aqi.parquet at commit 954db3ae9d526f17479f7a7f069ab56ad0a25cf8.
    year: 2023
    population: "Monitoring stations, not people -- 448 of 519 stations with >=50% of 2023's hours reporting"
    geographic_scope: "State/UT (Census 2011 boundaries)"
    definition: >-
      India National AQI (CPCB scale, 0-500), NOT the US EPA scale.
      Value = 2023 mean of hourly station AQI, averaged within each city
      first, then equally across a state's cities (so one heavily
      monitored metro does not dominate its state). Category from CPCB
      breakpoints: Good <=50, Satisfactory <=100, Moderate <=200, Poor
      <=300, Very Poor <=400, Severe >400.
    available_stratification: "Station/city; collapsed to state because the schema has no city/district field"
    marginal_or_conditional: "deterministic lookup by state"
    transformation: >-
      Station mean over 2023 hourly values -> city mean -> state mean.
      Census-2011 boundary mapping: Telangana stations pooled into
      "Andhra Pradesh" (undivided in 2011); "Odisha" mapped to "Orissa".
    limitations: >-
      (1) URBAN-BIASED: CPCB stations sit almost entirely in cities, so
      the state value is applied unadjusted to rural patients -- flagged
      on every record (air_quality.monitoring_bias). (2) State-level
      only; no within-state variation. (3) Mean of hourly AQI, not
      CPCB's official daily AQI: Delhi computes to 212.3 against the
      official 2023 daily-average AQI of 204 (CAQM, from CPCB data),
      about +4%. (4) Nine states/UTs (sum ~3.4% of the population) have
      no station with adequate 2023 coverage -> aqi null with a stated
      reason; no neighbour-state value is borrowed. (5) Several states
      rest on 1 station (count stored per record). (6) One reference
      year, not a lifetime exposure history.
    evidence_tier: "A (observed) for monitored cities; B (engineering) for the state aggregation and its application to rural patients"
    reference_year: 2023
    category_breakpoints:  # upper bound inclusive, CPCB National AQI
      Good: 50
      Satisfactory: 100
      Moderate: 200
      Poor: 300
      Very Poor: 400
      Severe: 500
    by_state:
